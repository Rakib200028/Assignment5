<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Portal System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f0f2f5;
            background-image:url(Image/75f6a2_5ac45205b0ce44ceafb73abb991befcf~mv2.gif);

        }
        .login-box {
            width: 400px;
            margin: 100px auto;
            padding: 25px;
            background:rgb(192, 251, 255);
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .eye-icon {
    position: absolute;
    right: 12px;
    top: 72%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #555;
}
    </style>
</head>
<body>
    <h1 style="text-align: center;margin-top: 20px;color: #fff;">Online Job Portal System</h1>
<div class="login-box">
    <h2>Log in</h2>

    <div id="message"></div>

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username">
    </div>

   <div class="mb-3 position-relative">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-control" placeholder="Enter password">

    <span class="eye-icon" onclick="togglePassword()" id="eye-icon">🙈</span>
</div>

    <button class="btn btn-primary w-100" onclick="login()">Login</button>
</div>
<script src="script28.js"></script>
</body>
</html>
